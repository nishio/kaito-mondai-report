<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KAITO cards</title>
<style>
  @font-face{font-family:"Noto Sans JP";font-style:normal;font-weight:400;font-display:block;src:url(_fonts/noto-400.woff2) format("woff2")}
  @font-face{font-family:"Noto Sans JP";font-style:normal;font-weight:700;font-display:block;src:url(_fonts/noto-700.woff2) format("woff2")}
  @font-face{font-family:"Noto Sans JP";font-style:normal;font-weight:900;font-display:block;src:url(_fonts/noto-900.woff2) format("woff2")}
  :root{
    --bg:#0d0d0d; --surface:#1a1a19; --surface2:#232321;
    --ink:#f6f5f2; --ink2:#c3c2b7; --muted:#8f8d86; --accent:#3987e5;
    --vocaloid:#3987e5; --neutral:#199e70; --takahashi:#e06a36; --media:#d29a1a;
    --clash:#3987e5; --reconcile:#199e70; --reflare:#e06a36; --warn:#f0a93a; --good:#2fb36a;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{width:1200px; height:675px; overflow:hidden}
  body{
    background:
      radial-gradient(900px 420px at 88% -12%, color-mix(in srgb,var(--accent) 26%, transparent), transparent 62%),
      radial-gradient(700px 500px at -8% 115%, color-mix(in srgb,var(--reconcile) 16%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:.012em;
  }
  .card{width:1200px; height:675px; padding:58px 64px 0; display:flex; flex-direction:column; position:relative}
  .kicker{font-size:21px; font-weight:700; letter-spacing:.12em; color:var(--accent); text-transform:uppercase}
  .kicker.w{color:var(--warn)}
  h1{font-size:62px; line-height:1.18; font-weight:900; letter-spacing:.002em; margin-top:14px}
  h1.sm{font-size:50px}
  .tag{color:var(--accent)} .hl{color:var(--warn)} .gd{color:var(--good)}
  .lead{font-size:25px; color:var(--ink2); line-height:1.55; margin-top:18px; max-width:980px}
  .foot{position:absolute; left:64px; right:64px; bottom:30px; display:flex; justify-content:space-between;
    align-items:center; font-size:19px; color:var(--muted); border-top:1px solid rgba(255,255,255,.1); padding-top:16px}
  .foot b{color:var(--ink2); font-weight:700}
  .foot .url{color:var(--accent); font-weight:700}
  .spacer{flex:1}
  /* stat tiles */
  .tiles{display:flex; gap:20px; margin-top:40px}
  .tile{background:var(--surface); border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:22px 30px; flex:1}
  .tile .v{font-size:58px; font-weight:900; line-height:1}
  .tile .k{font-size:21px; color:var(--muted); font-weight:700; margin-top:8px}
  /* phase */
  .phases{display:flex; align-items:stretch; gap:16px; margin-top:40px}
  .ph{flex:1; border-radius:18px; padding:24px 26px; color:#fff; position:relative}
  .ph.clash{background:var(--clash)} .ph.reconcile{background:var(--reconcile)} .ph.reflare{background:var(--reflare)}
  .ph .pt{font-size:23px; font-weight:700} .ph .pe{font-size:17px; opacity:.9; font-weight:700; letter-spacing:.08em}
  .ph .pv{font-size:60px; font-weight:900; line-height:1.05; margin-top:10px}
  .ph .pv small{font-size:24px; font-weight:700}
  .ph .pd{font-size:17px; opacity:.94; margin-top:6px; line-height:1.4}
  .arr{display:flex; align-items:center; font-size:34px; color:var(--muted); font-weight:900}
  /* cluster bars */
  .bars{margin-top:26px; display:flex; flex-direction:column; gap:12px}
  .row{display:flex; align-items:center; gap:16px}
  .row .nm{width:360px; font-size:20px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
  .row .track{flex:1; height:22px; background:var(--surface2); border-radius:11px; overflow:hidden}
  .row .fill{height:100%; border-radius:11px; background:var(--accent)}
  .row .vv{width:70px; text-align:right; font-size:20px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
  .big{font-size:40px; font-weight:900; margin-top:26px}
  .big .vs{color:var(--muted); font-size:30px; margin:0 14px; font-weight:700}
  .scat{margin-top:14px} #scat{width:100%; height:auto; display:block}
  .capline{font-size:20px; color:var(--ink2); margin-top:14px; line-height:1.4}
  .capline b{font-weight:700}
  /* verdict bullets */
  .bul{margin-top:30px; display:flex; flex-direction:column; gap:18px}
  .bul .b{display:flex; gap:16px; align-items:flex-start; font-size:25px; line-height:1.4; color:var(--ink2)}
  .bul .ic{flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:21px; color:#fff; background:var(--warn); margin-top:2px}
  .bul .b b{color:var(--ink)}
  .stamp{position:absolute; top:52px; right:64px; font-size:19px; font-weight:700; color:var(--muted)}
  .legend{display:flex; gap:22px; margin-top:20px; font-size:19px; color:var(--ink2); font-weight:700}
  .legend span{display:inline-flex; align-items:center; gap:8px}
  .sw{width:15px; height:15px; border-radius:4px; display:inline-block}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="data.js"></script>
<script>
var P = new URLSearchParams(location.search);
var c = P.get("c") || "1";
var el = document.getElementById("card");
var FOOT = '<div class="foot"><span><b>広聴AI（kouchou-ai）で分析</b> ・ 匿名化・両論併記</span><span class="url">nishio.github.io/kaito-mondai-report</span></div>';

var cards = {
"1": '\
<div class="stamp">観測 as-of 2026-10-13</div>\
<div class="kicker">ブロードリスニング分析</div>\
<h1><span class="tag">#KAITO</span> タグ被り騒動の<br>964意見を可視化する</h1>\
<div class="lead">2026年10月、King&amp;Prince・髙橋海人のソロ名義「KAITO」と、20年続く VOCALOID「KAITO」の <b>#KAITO</b> タグ衝突。公開ウェブ上の投稿・報道・まとめを広聴AIでクラスタリングした独立レポート。</div>\
<div class="tiles">\
<div class="tile"><div class="v">964</div><div class="k">収集した意見</div></div>\
<div class="tile"><div class="v">108</div><div class="k">情報ソース</div></div>\
<div class="tile"><div class="v">8</div><div class="k">主要クラスタ</div></div>\
</div><div class="spacer"></div>' + FOOT,

"2": '\
<div class="kicker">① 時系列 — 3つの局面</div>\
<h1 class="sm">炎上は<span class="tag">一本調子</span>ではなかった</h1>\
<div class="phases">\
<div class="ph clash"><div class="pe">CLASH</div><div class="pt">初期衝突</div><div class="pv">571<small> 件</small></div><div class="pd">名義・タグ衝突の発覚と初期の反発</div></div>\
<div class="arr">→</div>\
<div class="ph reconcile"><div class="pe">RECONCILE</div><div class="pt">相互理解</div><div class="pv">214<small> 件</small></div><div class="pd">「KAITOは楽器/製品」と理解し歩み寄る</div></div>\
<div class="arr">→</div>\
<div class="ph reflare"><div class="pe">REFLARE</div><div class="pt">再炎上</div><div class="pv">67<small> 件</small></div><div class="pd">過激化・事務所対応批判・低評価で再注目</div></div>\
</div>\
<div class="lead">和解の芽は<b>「クリプトン声明」クラスタ</b>に、再炎上は<b>「誹謗中傷・感情対立」クラスタ</b>に局在。意見内容の側からも3局面が裏づけられた（※「完全な和解」の報道はなく、ここでの相互理解は<b>芽</b>）。</div>\
<div class="spacer"></div>' + FOOT,

"3": '\
<div class="kicker">② 論点の地図 — 広聴AIクラスタ散布図</div>\
<h1 class="sm" style="font-size:42px">964意見を「意見の地図」に</h1>\
<div class="scat"><svg id="scat" viewBox="0 0 1000 392" preserveAspectRatio="xMidYMid meet"></svg></div>\
<div class="capline">近い点ほど似た意見・8クラスタに色分け　／　重心は <b class="gd">タグ/検索の混在 約38%</b> ＞ <b class="hl">命名の是非 約33%</b></div>\
<div class="spacer"></div>' + FOOT,

"4": '\
<div class="kicker w">③ ファクトチェック</div>\
<h1 class="sm">「低評価は<span class="tag">海外ファン</span>由来」説<br>→ <span class="hl">支持する証拠なし</span></h1>\
<div class="bul">\
<div class="b"><span class="ic">!</span><div>曲名「swim?」と BTS『SWIM』の一致は<b>偶然</b>。ARMY の反発・盗作主張を報じた資料は日英韓いずれも不在</div></div>\
<div class="b"><span class="ic">!</span><div>King&amp;Prince / 歌手Prince ファン関与の証拠は<b>ゼロ</b>。むしろ韓国の K&amp;P ファンは<b>好意的</b>（仮説と逆）</div></div>\
<div class="b"><span class="ic">!</span><div>YouTubeは2021年に公開dislikeを非表示化。「57万低評価」は単一媒体の未検証値で、<b>投票者の地域内訳は原理的に観測不可</b></div></div>\
</div>\
<div class="spacer"></div>' + FOOT,
};

el.innerHTML = cards[c] || cards["1"];

if(c==="3"){
  var K=["#3987e5","#d95926","#199e70","#c98500","#d55181","#2fa84f","#9085e9","#e66767"];
  var pts=(window.KAITO_DATA&&window.KAITO_DATA.points)||[];
  var W=1000,H=392,pad=16,iw=W-2*pad,ih=H-2*pad;
  var PX=function(x){return pad+x/1000*iw;},PY=function(y){return pad+(1-y/1000)*ih;};
  var G=K.map(function(){return[];});
  for(var i=0;i<pts.length;i++){var p=pts[i];if(G[p[2]])G[p[2]].push([PX(p[0]),PY(p[1])]);}
  function ct(ps){var sx=0,sy=0;ps.forEach(function(p){sx+=p[0];sy+=p[1];});return[sx/ps.length,sy/ps.length];}
  function core(ps,fr){if(ps.length<=6)return ps;var c=ct(ps);var d=ps.map(function(p){return[p,(p[0]-c[0])*(p[0]-c[0])+(p[1]-c[1])*(p[1]-c[1])];});d.sort(function(a,b){return a[1]-b[1];});return d.slice(0,Math.max(5,Math.round(ps.length*fr))).map(function(x){return x[0];});}
  function hull(P0){if(P0.length<3)return P0.slice();var P=P0.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});var cr=function(o,a,b){return(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);};var lo=[],hi=[],k;for(k=0;k<P.length;k++){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],P[k])<=0)lo.pop();lo.push(P[k]);}for(k=P.length-1;k>=0;k--){while(hi.length>=2&&cr(hi[hi.length-2],hi[hi.length-1],P[k])<=0)hi.pop();hi.push(P[k]);}lo.pop();hi.pop();return lo.concat(hi);}
  function ex(poly,c,q){return poly.map(function(p){var dx=p[0]-c[0],dy=p[1]-c[1],L=Math.sqrt(dx*dx+dy*dy)||1;return[p[0]+dx/L*q,p[1]+dy/L*q];});}
  var hs="",ps2="",cs="";
  for(var j=0;j<K.length;j++){var g=G[j];if(!g.length)continue;var c=ct(g);var hp=ex(hull(core(g,0.80)),c,9);if(hp.length>=3){hs+='<path d="M'+hp.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join('L')+'Z" fill="'+K[j]+'" fill-opacity="0.15" stroke="'+K[j]+'" stroke-width="2" stroke-opacity="0.65" stroke-linejoin="round"/>';}}
  for(var i2=0;i2<pts.length;i2++){var p2=pts[i2],ci=p2[2];ps2+='<circle cx="'+PX(p2[0]).toFixed(1)+'" cy="'+PY(p2[1]).toFixed(1)+'" r="3" fill="'+K[ci]+'" opacity="0.72"/>';}
  for(var j2=0;j2<K.length;j2++){var g2=G[j2];if(!g2.length)continue;var c2=ct(g2);cs+='<circle cx="'+c2[0].toFixed(1)+'" cy="'+c2[1].toFixed(1)+'" r="15" fill="'+K[j2]+'" stroke="#0d0d0d" stroke-width="2.5"/><text x="'+c2[0].toFixed(1)+'" y="'+(c2[1]+6).toFixed(1)+'" text-anchor="middle" fill="#fff" font-size="17" font-weight="700" font-family="Noto Sans JP,system-ui">'+(j2+1)+'</text>';}
  document.getElementById("scat").innerHTML=hs+ps2+cs;
}
</script>
</body>
</html>
